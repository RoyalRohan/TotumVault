[package]
name = "totumvault"
version = "1.3.2"
description = "TotumVault — Privacy-first, local-only password manager for Windows, macOS, Linux, and Android."
authors = ["TotumVault Open Source Contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "totumvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
zeroize = { version = "1.7", features = ["zeroize_derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
totp-lite = "2.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-fs = "2.5.2"
tauri-plugin-clipboard-manager = "2"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target."cfg(target_os = \"windows\")".dependencies]
windows = { version = "0.52", features = ["Win32_System_DataExchange", "Win32_Foundation", "Win32_System_Memory"] }

[target."cfg(target_os = \"linux\")".dependencies]
wl-clipboard-rs = "0.8"
x11-clipboard = "0.9"
